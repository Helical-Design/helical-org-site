<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">

<!-- Clean background -->
<rect width="800" height="400" fill="#F7F7FA"/>

<!-- HELICAL LOGO (refined, no artifacts, not parallel waves) -->
<g transform="translate(100,120)">

  <!-- Top ribbon -->
  <path d="
    M 0 40
    C 80 -10, 160 -10, 240 40
    S 400 90, 480 40
    " 
    stroke="#0B0F1A" stroke-width="28" fill="none" stroke-linecap="round"/>

  <!-- Middle ribbon (compressed + offset) -->
  <path d="
    M 0 90
    C 80 40, 160 40, 240 90
    S 400 140, 480 90
    " 
    stroke="#0B0F1A" stroke-width="24" fill="none" stroke-linecap="round"/>

  <!-- Bottom ribbon (tighter curve) -->
  <path d="
    M 0 140
    C 80 100, 160 100, 240 140
    S 400 180, 480 140
    " 
    stroke="#0B0F1A" stroke-width="20" fill="none" stroke-linecap="round"/>

</g>

<!-- Wordmark -->
<text x="100" y="300" font-family="Arial" font-size="36" font-weight="700" fill="#0B0F1A">
HELICAL
</text>

</svg>
