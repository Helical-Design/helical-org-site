<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D5EF3"/>
      <stop offset="100%" stop-color="#C43C99"/>
    </linearGradient>
    <style>
      .label { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 18px; fill: #6B7280; }
      .word { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 40px; font-weight: 700; letter-spacing: 1px; }
      .tag  { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 16px; fill: #6B7280; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F7F7FA"/>

  <!-- ===== Variant 1: Primary black ===== -->
  <text x="120" y="90" class="label">Primary / Black</text>
  <g transform="translate(120,120)">
    <!-- Production-style bezier ribbons -->
    <path d="M 26 64
             C 86 14, 170 12, 228 54
             C 264 81, 309 128, 350 162
             C 388 194, 436 194, 474 160
             C 510 127, 553 84, 587 53
             C 644 1, 730 7, 792 56"
          fill="none" stroke="#0B0F1A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 26 126
             C 86 76, 170 74, 228 116
             C 264 143, 309 190, 350 224
             C 388 256, 436 256, 474 222
             C 510 189, 553 146, 587 115
             C 644 63, 730 69, 792 118"
          fill="none" stroke="#0B0F1A" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 26 186
             C 86 136, 170 134, 228 176
             C 264 203, 309 250, 350 284
             C 388 316, 436 316, 474 282
             C 510 249, 553 206, 587 175
             C 644 123, 730 129, 792 178"
          fill="none" stroke="#0B0F1A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="120" y="500" class="word" fill="#0B0F1A">HELICAL</text>
  <text x="120" y="530" class="tag">AI systems designed for human clarity</text>

  <!-- ===== Variant 2: White on dark ===== -->
  <text x="980" y="90" class="label">Inverse / White</text>
  <g transform="translate(940,120)">
    <rect x="0" y="0" width="520" height="440" rx="24" fill="#0B0F1A"/>

    <g transform="translate(44,46)">
      <path d="M 26 64
               C 86 14, 170 12, 228 54
               C 264 81, 309 128, 350 162
               C 388 194, 436 194, 474 160
               C 510 127, 553 84, 587 53
               C 644 1, 730 7, 792 56"
            transform="scale(0.53)"
            fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M 26 126
               C 86 76, 170 74, 228 116
               C 264 143, 309 190, 350 224
               C 388 256, 436 256, 474 222
               C 510 189, 553 146, 587 115
               C 644 63, 730 69, 792 118"
            transform="scale(0.53)"
            fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M 26 186
               C 86 136, 170 134, 228 176
               C 264 203, 309 250, 350 284
               C 388 316, 436 316, 474 282
               C 510 249, 553 206, 587 175
               C 644 123, 730 129, 792 178"
            transform="scale(0.53)"
            fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="44" y="320" class="word" fill="#FFFFFF">HELICAL</text>
    <text x="44" y="350" class="tag" fill="#9CA3AF">AI systems designed for human clarity</text>
  </g>

  <!-- ===== Variant 3: Gradient hero ===== -->
  <text x="120" y="620" class="label">Hero / Gradient</text>
  <g transform="translate(120,650)">
    <path d="M 26 64
             C 86 14, 170 12, 228 54
             C 264 81, 309 128, 350 162
             C 388 194, 436 194, 474 160
             C 510 127, 553 84, 587 53
             C 644 1, 730 7, 792 56"
          fill="none" stroke="url(#helicalGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 26 126
             C 86 76, 170 74, 228 116
             C 264 143, 309 190, 350 224
             C 388 256, 436 256, 474 222
             C 510 189, 553 146, 587 115
             C 644 63, 730 69, 792 118"
          fill="none" stroke="url(#helicalGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 26 186
             C 86 136, 170 134, 228 176
             C 264 203, 309 250, 350 284
             C 388 316, 436 316, 474 282
             C 510 249, 553 206, 587 175
             C 644 123, 730 129, 792 178"
          fill="none" stroke="url(#helicalGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="120" y="860" class="word" fill="#0B0F1A">HELICAL</text>
