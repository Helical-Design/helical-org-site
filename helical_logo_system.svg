<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">

<!-- Background -->
<rect width="1440" height="900" fill="#F7F7FA"/>

<!-- ===== HELICAL LOGO (CLEAN VECTOR) ===== -->
<g transform="translate(120,120)">
  <!-- Ribbon 1 -->
  <path d="M0 60 C80 -20, 200 -20, 280 60 C360 140, 480 140, 560 60" 
        stroke="#0B0F1A" stroke-width="28" fill="none" stroke-linecap="round"/>

  <!-- Ribbon 2 -->
  <path d="M0 120 C80 40, 200 40, 280 120 C360 200, 480 200, 560 120" 
        stroke="#0B0F1A" stroke-width="24" fill="none" stroke-linecap="round"/>

  <!-- Ribbon 3 -->
  <path d="M0 180 C80 100, 200 100, 280 180 C360 260, 480 260, 560 180" 
        stroke="#0B0F1A" stroke-width="20" fill="none" stroke-linecap="round"/>
</g>

<!-- Wordmark -->
<text x="120" y="380" font-family="Plus Jakarta Sans, Arial" font-size="48" font-weight="700" fill="#0B0F1A">
HELICAL
</text>

<text x="120" y="420" font-family="Plus Jakarta Sans, Arial" font-size="16" fill="#6B7280">
AI systems designed for human clarity
</text>

<!-- ===== SIGNATURE COMPONENT ===== -->
<rect x="120" y="520" width="1000" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>

<!-- Input text -->
<text x="160" y="558" font-family="Plus Jakarta Sans, Arial" font-size="16" fill="#6B7280">
Search...
</text>

<!-- CTA with diagonal cut -->
<polygon points="820,520 1120,520 1120,584 860,584" fill="url(#grad)"/>

<text x="900" y="558" font-family="Plus Jakarta Sans, Arial" font-size="16" fill="#FFFFFF">
Get Started
</text>

<!-- Gradient -->
<defs>
  <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#6D5EF3"/>
    <stop offset="100%" stop-color="#C43C99"/>
  </linearGradient>
</defs>

</svg>
